<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays, DOM e Eventos</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    section { margin-top: 1.5rem; }
    ul { padding-left: 1.25rem; }
    li { cursor: pointer; padding: 2px 0; }
    .destaque { background: #fff3a3; font-weight: bold; }
    .feito { text-decoration: line-through; color: #888; }
    form, .campo { display: flex; gap: 0.5rem; margin: 0.75rem 0; }
    input { flex: 1; padding: 0.4rem; }
    button { padding: 0.4rem 0.9rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="titulo">Título original</h1>

  <p class="texto">Este é o primeiro parágrafo da página.</p>
  <p class="texto">Este é o segundo parágrafo da página.</p>
  <p class="texto">Este é o terceiro parágrafo da página.</p>

  <section>
    <h2>Eventos</h2>
    <button id="botao">Clique aqui</button>

    <div class="campo">
      <input type="text" id="nome" placeholder="Digite seu nome (veja o Console)">
    </div>
  </section>

  <section>
    <h2>Lista de itens</h2>
    <p>Clique em um item para marcar/desmarcar como feito.</p>
    <ul id="lista">
      <li>Item fixo 1 (HTML)</li>
      <li>Item fixo 2 (HTML)</li>
      <li>Item fixo 3 (HTML)</li>
    </ul>

    <form id="formulario">
      <input type="text" id="tarefa" placeholder="Nova tarefa">
      <button type="submit">Adicionar</button>
    </form>
  </section>

  <!-- defer: o script só roda depois que o HTML for lido -->
  <script src="app.js" defer></script>
</body>
</html>
